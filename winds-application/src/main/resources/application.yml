server:
  port: 9002
spring:
  application:
    name: winds-application
  profiles:
    include: dev
  cache:
    live-time: 180000
    type: redis
    redis:
      cache-null-values: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan:
        - com.hidewnd.winds.costing.controller
        - com.hidewnd.winds.aggregation.controller
        - com.hidewnd.winds.bot.huangli.controller
        - com.hidewnd.winds.scout.controller

# 单实例官方数据监听；只向在线 WebSocket 客户端广播。
winds:
  jx3:
    enabled: true
    # 新闻/公告成功后按此基准间隔 ±20% 抖动，失败仍指数退避。
    news-interval: 30s
    maintenance-interval: 30s
    server-interval: 10s
    patch-interval: 30s
    # 第三方开服及官方新闻/公告事件触发即时核验，共用此持续连接。
    socket:
      enabled: true
      endpoint: wss://socket.nicemoe.cn
      reconnect-interval: 15s
      heartbeat-timeout: 45s
