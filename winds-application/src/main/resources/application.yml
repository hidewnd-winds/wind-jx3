server:
  port: 9002
spring:
  application:
    name: winds-application
  profiles:
    include: dev
  cache:
    live-time: 180000
    type: redis
    redis:
      cache-null-values: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan:
        - com.hidewnd.winds.costing.controller
        - com.hidewnd.winds.aggregation.controller
        - com.hidewnd.winds.bot.huangli.controller
        - com.hidewnd.winds.scout.controller

winds:
  # 所有模块共用官方驱动连接池；地址、认证仍使用 spring.data.mongodb。
  mongodb:
    min-pool-size: 2
    max-pool-size: 100
    max-connecting: 2
    max-wait-time: 10s
    max-connection-idle-time: 5m
    maintenance-frequency: 30s
    server-selection-timeout: 5s
    connect-timeout: 5s
    read-timeout: 30s
  # 单实例官方数据监听；只向在线 WebSocket 客户端广播。
  jx3:
    enabled: true
    news-interval: 30s
    maintenance-interval: 30s
    server-interval: 10s
    server-connect-timeout: 3s
    patch-interval: 30s
    socket:
      enabled: true
      endpoint: wss://socket.nicemoe.cn
      reconnect-interval: 15s
      heartbeat-timeout: 45s
